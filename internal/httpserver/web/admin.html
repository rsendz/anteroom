<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101216" media="(prefers-color-scheme: dark)">
<title>Anteroom | Control room</title>
{{range .Styles}}<link rel="stylesheet" href="{{.}}">
{{end}}</head>
<body>
<div id="root" data-api="{{.APIPath}}"></div>
{{if not .Built}}
<p style="max-width:32rem;margin:14vh auto;padding:0 1.5rem;font:16px/1.6 system-ui,sans-serif;color:CanvasText;background:Canvas">
  The control room needs its front-end assets. Build them with <code>make web</code>,
  or manage rooms through the API under <code>{{.APIPath}}</code>.
</p>
{{end}}
{{range .Scripts}}<script type="module" src="{{.}}"></script>
{{end}}</body>
</html>
