# Configuration for the Docker Compose demo. The numbers are deliberately slow
# so a person can watch the queue work; see anteroom.example.yaml for what you
# would actually run in production.

listen: ":8080"
cookie_secret: "demo-only-cookie-secret-change-me"
admin_token: "demo-admin-token"
secure_cookies: false

redis:
  addr: "redis:6379"

kafka:
  brokers: ["kafka:9092"]
  topic: "anteroom.events"

rooms:
  # The catch-all room: anything not matched below lands here.
  shop:
    origin: "http://demo-origin:9000"
    rate: 0.5
    max_active: 3
    session_ttl: 60s
    abandon_after: 20s
    title: "The shop is busy"
    message: "We're letting people in a few at a time so the checkout stays fast."

  # A second room on the same instance, to show host-based routing. Reach it
  # with: curl -H "Host: tickets.localhost" http://localhost:8080/
  tickets:
    match_host: "tickets.localhost"
    origin: "http://demo-origin:9000"
    rate: 2
    max_active: 10
    session_ttl: 60s
    abandon_after: 20s
    title: "Tickets go on sale shortly"
